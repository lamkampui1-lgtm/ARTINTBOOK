<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食飯唔舒服：對定錯</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one full-screen classroom stage. Board = scenario card left, answer panel right, control bar below.
   iPad = picture on top, two giant answer buttons below. Single bright classroom look (same family as the lesson deck). */
:root{
  --mat:#DCEBD9; --grid:rgba(46,110,70,.13); --card:#FFFFFF; --line:#C3D9BF;
  --ink:#1F3A68; --ink2:#33415C; --soft:#5B6B85;
  --hi:#FFD84D; --ok:#1F7A3D; --okbg:#DDF2E2; --no:#B42318; --nobg:#FBE3E0;
  --wait:#EEF3EC;
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--mat);color:var(--ink);font-family:var(--f);
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);
  background-size:72px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:5px solid var(--ink);outline-offset:3px}
.view{height:100%;display:flex;flex-direction:column;gap:16px;min-height:0}
h1,h2{margin:0;text-wrap:balance}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 10px 24px rgba(31,58,104,.14)}
.hl{display:inline-block;background:var(--hi);padding:4px 18px;border-radius:6px;font-weight:900;transform:rotate(-1deg);box-shadow:0 4px 0 rgba(31,58,104,.15)}
.eyebrow{font-weight:700;color:#23663F;font-size:clamp(14px,1.6vw,20px);letter-spacing:.04em}

/* ---------- role picker ---------- */
#pick{align-items:center;justify-content:center;text-align:center}
#pick h1{font-size:clamp(30px,5vw,60px);font-weight:900}
.roles{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.role{width:min(320px,100%);padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:28px;font-weight:900}
.role small{font-size:17px;font-weight:500;color:var(--soft)}
.role svg{width:120px;height:120px}

/* ---------- board ---------- */
#board .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#board h1{font-size:clamp(24px,3vw,40px);font-weight:900}
.conn{font-size:16px;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--wait);color:var(--ink2)}
.conn.on{background:var(--okbg);color:var(--ok)}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;min-height:0}
.scene{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;min-height:0;position:relative}
.scene svg{width:100%;max-height:58vh;flex:1;min-height:0}
.scene .qtext{font-size:clamp(22px,2.6vw,38px);font-weight:900;text-align:center;line-height:1.35}
.qno{position:absolute;left:18px;top:14px;font-weight:900;font-size:18px;color:var(--soft)}
.say{position:absolute;right:16px;top:12px;width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:var(--hi);font-size:26px;display:grid;place-items:center}
.panel{display:flex;flex-direction:column;gap:12px;padding:18px;min-height:0;overflow:auto}
.panel .status{font-size:clamp(20px,2.2vw,30px);font-weight:900}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seat{border:3px solid var(--line);border-radius:18px;background:var(--wait);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.seat .ani{font-size:clamp(24px,2.6vw,36px);line-height:1.1}
.seat .nm{font-size:15px;font-weight:700;color:var(--ink2)}
.seat .st{font-size:15px;font-weight:900;min-height:1.3em}
.seat.in{background:#FFFFFF;border-color:#9DBB98}
.seat.ans{background:#FFF6CC;border-color:#E3B92E}
.seat.right{background:var(--okbg);border-color:var(--ok)}
.seat.wrong{background:var(--nobg);border-color:var(--no)}
.seat.manual .nm::after{content:" ✎";color:var(--soft)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tally div{border-radius:18px;padding:10px;text-align:center;font-weight:900;font-size:clamp(20px,2.4vw,34px);border:3px solid var(--line);background:#FFFFFF}
.tally .o{color:var(--ok)} .tally .x{color:var(--no)}
.answer{font-size:clamp(26px,3vw,44px);font-weight:900;text-align:center;border-radius:18px;padding:12px}
.answer.o{background:var(--okbg);color:var(--ok)} .answer.x{background:var(--nobg);color:var(--no)}
.tip{font-size:15px;color:var(--soft);margin:0}
.bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font-size:clamp(18px,2vw,24px);font-weight:900;border:3px solid var(--ink);background:#FFFFFF;border-radius:16px;padding:12px 26px}
.btn.main{background:var(--ink);color:#FFFFFF}
.btn:disabled{opacity:.4;cursor:default}

/* ---------- rooms ---------- */
.rightbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roomchip{display:flex;align-items:center;gap:10px;background:#FFFFFF;border:3px solid var(--ink);border-radius:16px;padding:6px 16px}
.rlabel{font-weight:700;font-size:18px;color:var(--ink2)}
.rcode{font-size:clamp(30px,3.6vw,48px);font-weight:900;letter-spacing:.12em;background:var(--hi);padding:0 12px;border-radius:8px;font-variant-numeric:tabular-nums}
.nameinput{display:block;width:min(520px,100%);margin:0 auto;font:900 clamp(32px,7vw,56px)/1.2 var(--f);text-align:center;color:var(--ink);background:#FFFFFF;border:5px solid var(--ink);border-radius:20px;padding:14px 18px}
.nameinput:focus{outline:5px solid var(--hi);outline-offset:3px}
.jtitle{text-align:center;font-size:clamp(28px,5vw,44px);font-weight:900}
.codebox{display:flex;justify-content:center;gap:14px}
.digit{width:clamp(60px,14vw,96px);height:clamp(76px,17vw,116px);border:5px solid var(--ink);border-radius:18px;background:#FFFFFF;display:grid;place-items:center;font-size:clamp(40px,9vw,68px);font-weight:900;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(520px,100%);margin:0 auto}
.key{border:4px solid var(--ink);border-radius:20px;background:#FFFFFF;font-size:clamp(30px,6vw,46px);font-weight:900;min-height:clamp(64px,10vh,96px)}
.key.ok{background:var(--ink);color:#FFFFFF}
.jerr{text-align:center;font-size:20px;font-weight:700;color:var(--no);min-height:1.4em;margin:0}
#iBody{overflow:auto}
.lobby{position:absolute;inset:0;background:#FFFFFF;border-radius:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;overflow:auto}
.lobby .big{font-size:clamp(28px,3.4vw,48px);font-weight:900}
.lobby .code{font-size:clamp(64px,10vw,150px);font-weight:900;letter-spacing:.14em;background:var(--hi);border-radius:16px;padding:0 28px;line-height:1.2;font-variant-numeric:tabular-nums}
.lobby .sub{font-size:clamp(18px,2vw,26px);color:var(--ink2);margin:0}
.btn.big{font-size:clamp(22px,2.6vw,32px);padding:14px 40px}
.score{display:flex;align-items:baseline;justify-content:flex-start;flex-wrap:wrap;gap:10px;font-weight:900;color:var(--ok)}
.score .n{font-size:clamp(48px,6vw,88px);line-height:1;font-variant-numeric:tabular-nums}
.score .u{font-size:clamp(22px,2.6vw,34px)}
.score .of{font-size:clamp(18px,2vw,26px);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chip{background:var(--okbg);color:var(--ok);border:2px solid var(--ok);border-radius:999px;padding:4px 14px;font-weight:900;font-size:clamp(16px,1.8vw,22px)}
.sumtab{width:min(640px,100%);border-collapse:collapse;font-size:clamp(18px,2.2vw,28px)}
.sumtab th,.sumtab td{padding:8px 14px;border-bottom:2px solid var(--line);text-align:left}
.sumtab td.num{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.stars{color:#E3B92E;letter-spacing:2px}
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ways div{background:#FFFFFF;border:3px solid var(--line);border-radius:16px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ways b{font-size:clamp(16px,1.7vw,24px)} .ways span{font-size:clamp(13px,1.3vw,17px);color:var(--ink2)}
.voicebtn{width:100%;min-height:clamp(120px,20vh,200px);flex-direction:row;gap:18px;font-size:clamp(30px,6vw,52px)}
.voicebtn .sym{font-size:clamp(50px,9vw,90px)}
.ans.small{min-height:clamp(100px,15vh,150px);font-size:clamp(24px,4.5vw,38px)}
.ans.small .sym{font-size:clamp(40px,7vw,64px)}
.ans.o.sel{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 0 8px rgba(31,122,61,.25)}
.swbtn{border:3px solid var(--ink);background:#FFFFFF;border-radius:999px;padding:6px 16px;font-size:16px;font-weight:900}
.swbtn.on{background:var(--hi)}
.swpanel{position:fixed;inset:0;background:rgba(31,58,104,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.swcard{background:#FFFFFF;border-radius:24px;border:3px solid var(--ink);padding:24px;width:min(640px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.swcard h2{font-size:28px;font-weight:900}
.swrow{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:3px solid var(--ink);border-radius:14px;background:#FFFFFF;padding:10px 18px;font-size:20px;font-weight:900}
.opt.sel{background:var(--ink);color:#FFFFFF}
.swcard p{margin:0;font-size:17px;color:var(--ink2);line-height:1.5}
.keytag{display:inline-block;background:var(--wait);border:2px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:900;color:var(--ink)}
.ans.scan{outline:10px solid var(--hi);outline-offset:4px;transform:scale(1.03)}
.learning{background:#FFF6CC;border:3px dashed #E3B92E;border-radius:14px;padding:12px;font-weight:900;font-size:20px;text-align:center}
.ans.dim{opacity:.3}
.joinlist{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:100%}
.joinchip{display:inline-flex;align-items:center;gap:8px;background:var(--okbg);border:3px solid var(--ok);border-radius:999px;padding:6px 20px 6px 10px;font-weight:900;font-size:clamp(20px,2.4vw,32px);color:var(--ink)}
.jani{font-size:clamp(30px,3.4vw,46px);line-height:1}
.seat.mark .st{font-size:clamp(26px,3vw,40px);line-height:1}
.seat.right.mark .st{color:var(--ok)} .seat.wrong.mark .st{color:var(--no)}
/* ---------- iPad ---------- */
#ipad .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.me{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900}
.me .ani{font-size:40px}
.ipadscene{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;min-height:0;position:relative}
.ipadscene svg{width:100%;flex:1;min-height:0;max-height:40vh}
.ipadscene .qtext{font-size:clamp(22px,4.5vw,36px);font-weight:900;text-align:center;line-height:1.35}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ans{border-radius:28px;border:6px solid var(--ink);background:#FFFFFF;min-height:clamp(140px,26vh,260px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:clamp(28px,6vw,52px)}
.ans .sym{font-size:clamp(60px,12vw,120px);line-height:1}
.ans.o .sym{color:var(--ok)} .ans.x .sym{color:var(--no)}
.ans.sel.o{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 0 8px rgba(31,122,61,.25)}
.ans.sel.x{background:var(--nobg);border-color:var(--no);box-shadow:0 0 0 8px rgba(180,35,24,.25)}
.ans:disabled{cursor:default}
.feedback{font-size:clamp(26px,5vw,44px);font-weight:900;text-align:center;border-radius:20px;padding:12px}
.feedback.good{background:var(--okbg);color:var(--ok)} .feedback.bad{background:var(--nobg);color:var(--no)} .feedback.wait{background:#FFFFFF;color:var(--ink2)}
.seatpick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sp{border:4px solid var(--ink);border-radius:22px;background:#FFFFFF;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px;font-weight:900}
.sp .ani{font-size:clamp(40px,8vw,64px)}
.sp:disabled{opacity:.35}
.note{font-size:18px;color:var(--ink2);text-align:center;margin:0}
.link{background:none;border:0;font-size:16px;font-weight:700;color:var(--soft);text-decoration:underline}

@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .seats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .seatpick{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
}
</style>
</head>
<body>

<!-- Role picker -->
<section class="view" id="pick">
  <p class="eyebrow">課題一：進食時不適的處理方法</p>
  <h1>對定錯？</h1>
  <div class="roles">
    <button class="card role" id="toBoard" type="button">
      <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="8" y="16" width="104" height="70" rx="8" fill="#FFFFFF" stroke="#1F3A68" stroke-width="6"/><rect x="20" y="28" width="40" height="30" rx="4" fill="#8EC9EE"/><path d="M70 34h30M70 46h22" stroke="#1F3A68" stroke-width="6" stroke-linecap="round"/><path d="M60 86v20M40 108h40" stroke="#1F3A68" stroke-width="6" stroke-linecap="round"/></svg>
      電子白板<small>老師用：出題、睇答案</small>
    </button>
    <button class="card role" id="toIpad" type="button">
      <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="22" y="8" width="76" height="104" rx="12" fill="#FFFFFF" stroke="#1F3A68" stroke-width="6"/><circle cx="46" cy="70" r="14" fill="#DDF2E2" stroke="#1F7A3D" stroke-width="5"/><path d="M66 58l20 22M86 58L66 80" stroke="#B42318" stroke-width="6" stroke-linecap="round"/><path d="M42 26h36" stroke="#1F3A68" stroke-width="6" stroke-linecap="round"/></svg>
      學生 iPad<small>學生用：揀啱定唔啱</small>
    </button>
  </div>
</section>

<!-- Whiteboard -->
<section class="view" id="board" hidden>
  <div class="top">
    <div><p class="eyebrow">課題一 · 對定錯？</p><h1>佢咁做，啱定唔啱？</h1></div>
    <div class="rightbox"><div class="roomchip" id="bRoom"></div><span class="conn" id="bConn">連線中…</span></div>
  </div>
  <div class="stage">
    <div class="card scene" id="bScene">
      <span class="qno" id="bNo"></span>
      <button class="say" id="bSay" type="button" aria-label="讀出題目">🔊</button>
      <div id="bPic"></div>
      <p class="qtext" id="bText"></p>
      <div id="bLobby" class="lobby" hidden></div>
    </div>
    <div class="card panel">
      <p class="status" id="bStatus"></p>
      <div class="seats" id="bSeats"></div>
      <div id="bResult"></div>
      <p class="tip" id="bTip"></p>
    </div>
  </div>
  <div class="bar">
    <button class="btn main big" id="bStart" type="button" hidden>開始遊戲 ▶</button>
    <button class="btn main big" id="bReplay" type="button" hidden>再玩一次</button>
    <button class="btn" id="bPrev" type="button">◀ 上一題</button>
    <button class="btn" id="bAgain" type="button">重新作答</button>
    <button class="btn main" id="bReveal" type="button">揭曉答案</button>
    <button class="btn" id="bNext" type="button">下一題 ▶</button>
    <button class="link" id="bBack" type="button">轉身分</button>
  </div>
</section>

<!-- Student iPad -->
<section class="view" id="ipad" hidden>
  <div class="top">
    <div class="me" id="iMe"></div>
    <span class="rightbox"><button class="swbtn" id="swOpen" type="button">拍掣：關</button><span class="conn" id="iConn">連線中…</span></span>
  </div>
  <div id="iBody" class="view"></div>
  <div id="swPanel" class="swpanel" hidden></div>
</section>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- content ---------- */
const QS=[
  {sym:"tummy",act:"eat",  text:"食飯時肚痛，佢繼續食。", ok:false, why:"肚痛要停低食。", say:"肚痛"},
  {sym:"tummy",act:"stop", text:"食飯時肚痛，佢放低餐具，講「肚痛」。", ok:true, why:"佢做得好好。", say:"肚痛"},
  {type:"speak",sym:"tummy",act:"stop",text:"輪到你講：「肚痛」",phrase:"肚痛",say:"肚痛",gest:"一手按肚，一手舉高"},
  {sym:"hot",  act:"stop", text:"食物太熱，佢放低餐具，講「太熱」。", ok:true, why:"太熱要放低，話俾身邊嘅人知。", say:"太熱"},
  {type:"speak",sym:"hot",act:"stop",text:"輪到你講：「太熱」",phrase:"太熱",say:"太熱",gest:"一手扇口，一手舉高"},
  {sym:"full", act:"eat",  text:"佢已經好飽，仲繼續食。", ok:false, why:"飽咗要停低食，話俾身邊嘅人知。", say:"好飽"},
  {sym:"sick", act:"leave",text:"佢想嘔，自己走開，冇話俾人知。", ok:false, why:"想嘔要話俾身邊嘅人知。", say:"想嘔"},
  {sym:"tongue",act:"stop",text:"佢咬到脷，放低餐具，講「咬親」。", ok:true, why:"佢做得好好。", say:"咬親"},
  {type:"speak",sym:"tongue",act:"stop",text:"輪到你講：「咬親」",phrase:"咬親",say:"咬親",gest:"一手掩口，一手舉高"}
];
const QN=QS.filter(x=>!x.type).length;
function qLabel(i){if(QS[i].type)return "練習講";let n=0;for(let k=0;k<=i;k++)if(!QS[k].type)n++;return `第 ${n} / ${QN} 題`}
function promptOf(i){const q=QS[i];return q.type==="speak"?"輪到你講："+q.phrase:q.text+"……啱定唔啱？"}
const SAYS={said:"🗣 講咗",tap:"🔊 撳咗掣",sign:"✋ 做咗手勢"};
const SEATS=[["🐻","小熊"],["🐰","小兔"],["🐱","小貓"],["🐶","小狗"],["🐼","熊貓"],["🐸","青蛙"],["🐧","企鵝"],["🦁","獅子"]];
const RULE="唔舒服，停低食，叫老師！";

/* ---------- picture ---------- */
const N="#1F3A68";
function scene(q){
  const s=q.sym,a=q.act;
  const shift=a==="leave"?95:0;
  const left=!!shift||a==="stop";
  const face=s==="sick"?"#CFE8C4":"#FFD9B8";
  let eyes, mouth;
  if(s==="tummy"||s==="tongue"){eyes=`<path d="M175 100l14 6-14 6M225 100l-14 6 14 6" fill="none" stroke="${N}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}
  else{eyes=`<circle cx="182" cy="106" r="6" fill="${N}"/><circle cx="218" cy="106" r="6" fill="${N}"/>`}
  if(s==="tongue"){mouth=`<path d="M184 132q16 14 32 0z" fill="#7A2E2E" stroke="${N}" stroke-width="4" stroke-linejoin="round"/><path d="M190 134q10 16 20 0" fill="#E86F7A" stroke="${N}" stroke-width="3"/>`}
  else if(s==="hot"){mouth=`<ellipse cx="200" cy="134" rx="10" ry="12" fill="#7A2E2E" stroke="${N}" stroke-width="4"/>`}
  else if(a==="leave"){mouth=`<path d="M188 136h24" stroke="${N}" stroke-width="5" stroke-linecap="round"/>`}
  else if(s==="full"){mouth=`<path d="M186 134q14 8 28 0" fill="none" stroke="${N}" stroke-width="5" stroke-linecap="round"/><path d="M168 122q-6 2-8 8M232 122q6 2 8 8" stroke="#E86F7A" stroke-width="5" stroke-linecap="round"/>`}

const sDing=()=>tone([[660,.14],[880,.14],[1320,.3]]);

  const start=()=>{if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,150)}else go()};
  if(!voicesReady&&ss.getVoices().length===0){let done=false;const h=()=>{if(done)return;done=true;voicesReady=true;start()};try{ss.addEventListener("voiceschanged",h,{once:true})}catch(e){}setTimeout(h,800)}else{voicesReady=true;start()}

/* PeerJS rooms: used only when the page runs outside Claude (e.g. GitHub Pages) */
function peerLobby(){
  const PFX="artintbook-food-";
  function base(){
    const st={peers:new Map(),cbs:new Set(),ccb:new Set(),me:null,connected:false};
    const snap=()=>Object.freeze(Array.from(st.peers.values()));
    const emit=()=>{const ps=snap();st.cbs.forEach(f=>{try{f({peers:ps,joined:[],left:[],updated:[]})}catch(e){}})};
    const setConn=v=>{if(st.connected===v)return;st.connected=v;st.ccb.forEach(f=>{try{f(v)}catch(e){}})};
    const api=(extra)=>Object.assign({
      peers:()=>snap(),
      onPeers(f){st.cbs.add(f);setTimeout(()=>{try{f({peers:snap(),joined:[],left:[],updated:[]})}catch(e){}},0);return()=>st.cbs.delete(f)},
      onConnection(f){st.ccb.add(f);setTimeout(()=>{try{f(st.connected)}catch(e){}},0);return()=>st.ccb.delete(f)},
      connected:()=>st.connected
    },extra);
    return {st,snap,emit,setConn,api};
  }
  function host(name){return new Promise((res,rej)=>{
    const c=base(),id=PFX+name,conns=new Map();let done=false;
    const peer=new window.Peer(id);
    const bcast=()=>{const list=c.snap().map(p=>({peer:p.peer,presence:p.presence,updatedAt:p.updatedAt}));conns.forEach(cn=>{try{if(cn.open)cn.send({t:"peers",list})}catch(e){}})};
    const changed=()=>{c.emit();bcast()};
    const api=c.api({
      presence(p){const me=c.st.peers.get(id);if(me){c.st.peers.set(id,Object.assign({},me,{presence:Object.assign({},me.presence,p),updatedAt:Date.now()}));changed()}return Promise.resolve()},
      leave(){try{peer.destroy()}catch(e){}c.setConn(false);return Promise.resolve()}
    });
    peer.on("open",()=>{c.st.me=id;c.st.peers.set(id,{peer:id,presence:{},updatedAt:Date.now(),isMe:true,sameTab:true,kind:"viewer"});c.setConn(true);if(!done){done=true;res(api)}});
    peer.on("connection",cn=>{
      cn.on("open",()=>{conns.set(cn.peer,cn);bcast()});
      cn.on("data",d=>{if(d&&d.t==="presence"&&d.p&&typeof d.p==="object"){const old=c.st.peers.get(cn.peer);c.st.peers.set(cn.peer,{peer:cn.peer,presence:Object.assign({},old?old.presence:{},d.p),updatedAt:Date.now(),isMe:false,sameTab:false,kind:"viewer"});changed()}});
      const gone=()=>{conns.delete(cn.peer);if(c.st.peers.delete(cn.peer))changed()};
      cn.on("close",gone);cn.on("error",gone);
    });
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
    peer.on("error",e=>{if(!done){done=true;try{peer.destroy()}catch(x){}rej(e)}});
    setTimeout(()=>{if(!done){done=true;try{peer.destroy()}catch(x){}rej(new Error("timeout"))}},12000);
  })}
  function guest(name){return new Promise((res,rej)=>{
    const c=base(),hostId=PFX+name;let cn=null,done=false,left=false,my={};
    const peer=new window.Peer();
    const apply=list=>{c.st.peers.clear();for(const p of (Array.isArray(list)?list:[])){if(!p||typeof p.peer!=="string")continue;const mine=p.peer===c.st.me;c.st.peers.set(p.peer,{peer:p.peer,presence:(p.presence&&typeof p.presence==="object")?p.presence:{},updatedAt:+p.updatedAt||0,isMe:mine,sameTab:mine,kind:"viewer"})}c.emit()};
    const api=c.api({
      presence(p){my=Object.assign({},my,p);try{if(cn&&cn.open)cn.send({t:"presence",p:my})}catch(e){}return Promise.resolve()},
      leave(){left=true;try{peer.destroy()}catch(e){}c.setConn(false);return Promise.resolve()}
    });
    const connect=()=>{if(left)return;cn=peer.connect(hostId,{reliable:true});
      cn.on("open",()=>{c.setConn(true);try{cn.send({t:"presence",p:my})}catch(e){}if(!done){done=true;res(api)}});
      cn.on("data",d=>{if(d&&d.t==="peers")apply(d.list)});
      cn.on("close",()=>{c.setConn(false);if(done&&!left)setTimeout(connect,3000)});};
    peer.on("open",id=>{c.st.me=id;connect()});
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
    peer.on("error",e=>{if(!done){done=true;left=true;try{peer.destroy()}catch(x){}rej(e)}else if(e&&e.type==="peer-unavailable"){c.setConn(false);setTimeout(connect,3000)}});
    setTimeout(()=>{if(!done){done=true;left=true;try{peer.destroy()}catch(x){}rej(new Error("timeout"))}},12000);
  })}
  return {join:(name,isHost)=>isHost?host(name):guest(name)};
}

  const el=$("bRoom");
  if(B.code){el.innerHTML=`<span class="rlabel">房間號碼</span><b class="rcode"></b><button type="button" class="link" id="bNew">開新房間</button>`;el.querySelector(".rcode").textContent=B.code;$("bNew").onclick=()=>bOpen(newCode())}
  else if(B.lobbyNull){el.innerHTML=`<span class="rlabel">未能開房：請檢查網絡，或者用「代記錄」</span>`}
  else el.innerHTML=`<span class="rlabel">開房中…</span>`;
}
async function bOpen(code){
  const lobby=await getRoom();if(!lobby){B.lobbyNull=true;renderRoomChip();return}
  try{if(B.room&&B.room.leave)await B.room.leave()}catch(e){}
  B.room=null;B.code=null;renderRoomChip();
  try{
    const r=await lobby.join("cls-"+code,true);B.room=r;B.code=code;B.retry=0;
    try{sessionStorage.setItem("bcode",code)}catch(e){}
    bindConn(r,$("bConn"),"已開房");
    r.onPeers(()=>bRender(),()=>{});
    B.ep++;bPublish();
  }catch(e){B.room=null;B.code=null;if((B.retry=(B.retry||0)+1)<4)return bOpen(newCode());bindConn(null,$("bConn"))}
  renderRoomChip();bRender();
}
async function startBoard(){
  bRender();renderRoomChip();
  if(B.started)return;B.started=true;
  const lobby=await getRoom();
  if(!lobby){B.lobbyNull=true;bindConn(null,$("bConn"));renderRoomChip();bRender();return}
  let code=null;try{code=sessionStorage.getItem("bcode")}catch(e){}
  await bOpen(code&&/^\d{4}$/.test(code)?code:newCode());
}

/* ---------- iPad ---------- */
const I={name:"",typed:"",lobby:null,lobbyKnown:false,code:null,seat:null,ans:null,q:-1,ep:0,phase:"ask",room:null,started:false,solo:false,soloQ:0,lastPhase:""};
try{const n=sessionStorage.getItem("sname");if(n)I.name=n.slice(0,8)}catch(e){}
try{const s=sessionStorage.getItem("seat");if(s!==null&&+s>=0&&+s<8)I.seat=+s}catch(e){}
function iBoard(){if(!I.room)return null;let best=null;for(const p of I.room.peers()){const s=p.presence||{};if(s.role==="board"&&Number.isInteger(s.q)&&s.q>=0&&s.q<QS.length){if(!best||p.updatedAt>best.updatedAt)best=p}}return best&&best.presence}
function iPublish(){if(I.room&&I.seat!==null)I.room.presence({role:"student",seat:I.seat,name:I.name,q:I.q,ep:I.ep,ans:I.ans,fix:I.fix||null,sw:!!I.sw}).catch(()=>{})}
function taken(){const t=new Set();if(I.room){for(const p of I.room.peers()){if(p.sameTab)continue;const s=p.presence||{};if(s.role==="student"&&Number.isInteger(s.seat))t.add(s.seat)}}return t}
function iRender(){
  const body=$("iBody");
  if(!I.solo&&!I.room){$("iMe").innerHTML="";renderJoin();return}
  $("iMe").innerHTML=(I.seat===null||I.solo)?"":`<span class="ani">${SEATS[I.seat][0]}</span><span></span>`;
  if(I.seat!==null&&!I.solo)$("iMe").lastChild.textContent=I.name||SEATS[I.seat][1];
  if(!I.solo&&!I.name){
    body.innerHTML=`<h2 class="jtitle">你叫咩名？</h2>
      <input id="nmIn" class="nameinput" type="text" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="輸入你嘅名">
      <div class="bar"><button class="btn main" id="nmGo" type="button" disabled>下一步</button></div>`;
    const inp=$("nmIn"),go=$("nmGo");
    inp.value=I.draftName||"";go.disabled=!inp.value.trim();
    inp.oninput=()=>{I.draftName=inp.value;go.disabled=!inp.value.trim()};
    const done=()=>{const v=inp.value.trim().slice(0,8);if(!v)return;I.name=v;try{sessionStorage.setItem("sname",v)}catch(e){}say(v);iPublish();iRender()};
    go.onclick=done;inp.onkeydown=e=>{if(e.key==="Enter")done()};
    setTimeout(()=>{try{inp.focus()}catch(e){}},50);
    return;
  }
  if(I.seat===null&&!I.solo){
    const t=taken();
    body.innerHTML=`<h2 style="text-align:center;font-size:clamp(26px,5vw,40px);font-weight:900">${esc(I.name)}，揀一隻動物</h2><div class="seatpick" id="sp"></div>`;
    SEATS.forEach(([ani,nm],i)=>{const b=document.createElement("button");b.type="button";b.className="sp";b.disabled=t.has(i);b.innerHTML=`<span class="ani">${ani}</span><span></span>`;b.lastChild.textContent=nm;b.onclick=()=>{I.seat=i;try{sessionStorage.setItem("seat",String(i))}catch(e){}say(nm);iPublish();iRender()};$("sp").appendChild(b)});
    return;
  }
  const bp=iBoard();
  let q,phase;
  if(bp&&!I.solo&&bp.phase==="end"){
    const sc=bp.sc&&typeof bp.sc==="object"?bp.sc[I.seat]:null;const n=Number.isInteger(sc)?sc:null;
    if(I.lastPhase!=="end"){sDing();if(n!==null)say(`完成！你答啱${n}題`)}I.lastPhase="end";
    body.innerHTML=`<div class="card ipadscene" style="justify-content:center;gap:18px"><p class="qtext">完成！</p>${n!==null?`<p class="feedback good">你答啱 ${n} 題 <span class="stars">${"★".repeat(n)}</span></p>`:""}<p class="note">睇吓白板，等老師講解。</p></div>`;
    return;
  }
  if(bp&&!I.solo&&bp.phase!=="lobby"){
    if(bp.q!==I.q||bp.ep!==I.ep){I.q=bp.q;I.ep=bp.ep;I.ans=null;I.fix=null;I.sw=false;SW.idx=1;lastTick=Date.now();iPublish();if(bp.phase==="ask")say(promptOf(bp.q))}
    q=QS[I.q];phase=bp.phase==="reveal"?"reveal":"ask";
  } else if(I.solo||!I.room){
    I.solo=true;q=QS[I.soloQ];phase=I.ans?"reveal":"ask";
  } else {
    body.innerHTML=`<div class="card ipadscene" style="justify-content:center"><p class="qtext">${esc(I.name)}，等老師開始…</p><p class="note">${bp?"已經連到老師。老師撳「開始」之後，題目會自動出現。":`房間號碼 ${esc(I.code)}。老師喺白板開咗呢個房間，題目就會自動出現。`}</p></div><div class="bar"><button class="link" id="chg" type="button">轉動物</button><button class="link" id="rn" type="button">改名</button><button class="link" id="lv" type="button">轉房間</button></div>`;
    $("rn").onclick=()=>{I.draftName=I.name;I.name="";try{sessionStorage.removeItem("sname")}catch(e){}iRender()};
    $("lv").onclick=()=>iLeave();
    $("chg").onclick=()=>{I.seat=null;try{sessionStorage.removeItem("seat")}catch(e){}iPublish();iRender()};
    return;
  }
  if(q.type==="speak"){renderSpeak(q);return}
  const correct=q.ok?"o":"x";
  let state;
  if(I.solo) state=I.ans===correct?"done":"pick";
  else if(phase==="ask") state=I.ans?"wait":"pick";
  else state=(I.ans===correct||I.fix===correct)?"done":"retry";
  const wrongPick=I.solo?I.wrong:(state==="retry"?I.ans:null);
  I.canPick=state==="pick"||state==="retry";
  let fb="";
  if(state==="wait")fb=`<div class="feedback wait">已經揀咗，等老師揭曉…</div>`;
  else if(state==="done")fb=`<div class="feedback good pop">${(I.fix||I.wrong)?"答啱喇！做得好！":"答啱喇！"}</div>`;
  else if(state==="retry")fb=`<div class="feedback bad pop">${I.ans?"再答多次！":"答案揭曉咗，揀一次正確答案。"}</div>`;
  else if(I.solo&&I.wrong)fb=`<div class="feedback bad pop">再答多次！</div>`;
  if(!I.solo&&phase==="reveal"&&I.lastPhase!=="reveal"){
    if(state==="done")sDing();
    else{sSoft();setTimeout(()=>say(I.ans?"再答多次":"揀一次正確答案"),1200)}
  }
  I.lastPhase=phase;
  const dis=v=>(state==="done"||state==="wait"&&false||v===wrongPick)?"disabled":"";
  const sel=v=>(state==="done"?v===correct:(state==="wait"||state==="pick")&&!I.solo&&I.ans===v)?" sel":"";
  body.innerHTML=`<div class="card ipadscene"><button class="say" id="iSay" type="button" aria-label="讀出題目">🔊</button>${scene(q)}<p class="qtext"></p></div>
    <div class="answers"><button type="button" class="ans o${sel("o")}${wrongPick==="o"?" dim":""}" id="aO" ${dis("o")}><span class="sym">⭕</span>啱</button><button type="button" class="ans x${sel("x")}${wrongPick==="x"?" dim":""}" id="aX" ${dis("x")}><span class="sym">✕</span>唔啱</button></div>
    ${fb}
    ${I.solo?`<div class="bar"><button class="btn" id="sNext" type="button">${I.soloQ<QS.length-1?"下一題 ▶":"由頭再嚟"}</button>${I.room?'<button class="link" id="sBack" type="button">返回老師嘅遊戲</button>':(I.lobby?'<button class="link" id="sBack" type="button">入老師嘅房間</button>':"")}</div>`:""}`;
  body.querySelector(".qtext").textContent=q.text;
  $("iSay").onclick=()=>say(promptOf(I.solo?I.soloQ:I.q));
  const pickA=v=>{
    if(!I.canPick||v===wrongPick)return;
    if(I.solo){if(v===correct){I.ans=v;sDing();say("答啱喇！")}else{I.wrong=v;sSoft();say("再答多次")}}
    else if(state==="retry"){if(v===correct){I.fix=v;sDing();say("答啱喇！")}else{sSoft();say("再答多次")}}
    else{I.ans=v;sPop();say(v==="o"?"啱":"唔啱")}
    iPublish();iRender();
  };
  $("aO").onclick=()=>pickA("o");$("aX").onclick=()=>pickA("x");applyScan();
  if(I.solo){
    const n=$("sNext");if(n)n.onclick=()=>{I.soloQ=I.soloQ<QS.length-1?I.soloQ+1:0;I.ans=null;I.wrong=null;I.sw=false;I.lastPhase="";SW.idx=1;lastTick=Date.now();iRender();say(promptOf(I.soloQ))};
    const sb=$("sBack");if(sb)sb.onclick=()=>{I.solo=false;I.ans=null;I.q=-1;iRender()};
  }
}
function renderJoin(){
  const body=$("iBody");
  if(!I.lobbyKnown){body.innerHTML=`<div class="card ipadscene" style="justify-content:center"><p class="qtext">準備中…</p></div>`;return}
  if(!I.lobby){
    body.innerHTML=`<div class="card ipadscene" style="justify-content:center;gap:18px"><p class="qtext">自己練習</p><p class="note">未能連線，入唔到老師嘅房間。可以自己練習，答完即刻知對錯。</p><button class="btn main" id="goSolo2" type="button">開始練習</button></div>`;
    $("goSolo2").onclick=()=>{I.solo=true;I.ans=null;iRender();say(promptOf(I.soloQ))};return;
  }
  body.innerHTML=`<h2 class="jtitle">輸入房間號碼</h2>
    <div class="codebox" id="cb" aria-live="polite"></div>
    <div class="keypad" id="kp"></div>
    <p class="jerr" id="jerr"></p>
    <div class="bar"><button class="btn main" id="jGo" type="button">入房</button><button class="link" id="goSolo3" type="button">唔入房，自己練習</button></div>`;
  const draw=()=>{const cb=$("cb");cb.innerHTML="";for(let i=0;i<4;i++){const d=document.createElement("span");d.className="digit";d.textContent=I.typed[i]||"";cb.appendChild(d)}$("jGo").disabled=I.typed.length!==4};
  ["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(k=>{const b=document.createElement("button");b.type="button";b.className="key"+(k==="✓"?" ok":"");b.textContent=k;b.setAttribute("aria-label",k==="⌫"?"刪除":k==="✓"?"入房":k);
    b.onclick=()=>{if(k==="⌫"){I.typed=I.typed.slice(0,-1);say("刪除")}else if(k==="✓"){if(I.typed.length===4)iJoin(I.typed);return}else if(I.typed.length<4){I.typed+=k;say(k)}sPop();draw()};$("kp").appendChild(b)});
  $("jGo").onclick=()=>iJoin(I.typed);
  $("goSolo3").onclick=()=>{I.solo=true;I.ans=null;iRender();say(promptOf(I.soloQ))};
  draw();
}
function renderSpeak(q){
  const body=$("iBody");
  const done=!!I.ans;
  body.innerHTML=`<div class="card ipadscene"><button class="say" id="iSay" type="button" aria-label="再聽一次">🔊</button>${scene(q)}<p class="qtext"></p></div>
    <button type="button" class="ans o voicebtn${I.ans==="tap"?" sel":""}" id="vTap"><span class="sym">🔊</span>${esc(q.phrase)}</button>
    <div class="answers"><button type="button" class="ans o small${I.ans==="said"?" sel":""}" id="vSaid"><span class="sym">🗣</span>我講咗</button><button type="button" class="ans o small${I.ans==="sign"?" sel":""}" id="vSign"><span class="sym">✋</span>我做咗手勢</button></div>
    ${done?`<div class="feedback good pop">做得好！大家知道你唔舒服喇。</div>`:""}
    ${I.solo?soloBar():""}`;
  body.querySelector(".qtext").textContent=q.text;
  $("iSay").onclick=()=>say(promptOf(I.solo?I.soloQ:I.q));
  const mark=(v,talk)=>{const first=!I.ans;I.ans=v;if(talk)say(q.phrase);else{sPop()}if(first)setTimeout(sDing,talk?1600:150);iPublish();iRender()};
  $("vTap").onclick=()=>mark("tap",true);
  $("vSaid").onclick=()=>mark("said",false);
  $("vSign").onclick=()=>mark("sign",false);
  wireSolo();
}
function soloBar(){return `<div class="bar"><button class="btn" id="sNext" type="button">${I.soloQ<QS.length-1?"下一題 ▶":"由頭再嚟"}</button>${I.room?'<button class="link" id="sBack" type="button">返回老師嘅遊戲</button>':(I.lobby?'<button class="link" id="sBack" type="button">入老師嘅房間</button>':"")}</div>`}
function wireSolo(){
  if(!I.solo)return;
  const n=$("sNext");if(n)n.onclick=()=>{I.soloQ=I.soloQ<QS.length-1?I.soloQ+1:0;I.ans=null;I.wrong=null;I.sw=false;I.lastPhase="";SW.idx=1;lastTick=Date.now();iRender();say(promptOf(I.soloQ))};
  const sb=$("sBack");if(sb)sb.onclick=()=>{I.solo=false;I.ans=null;I.q=-1;iRender()};
}
async function iJoin(code){
  if(!I.lobby||!/^\d{4}$/.test(code))return;
  const e=$("jerr");if(e)e.textContent="入緊房…";
  try{
    const r=await I.lobby.join("cls-"+code);
    I.room=r;I.code=code;I.solo=false;I.q=-1;I.ans=null;
    try{sessionStorage.setItem("icode",code)}catch(x){}
    bindConn(r,$("iConn"),"已入房 "+code);
    r.onPeers(()=>{if(!I.solo||I.seat===null)iRender()},()=>{I.room=null;iRender()});
    say("入咗房");iPublish();
  }catch(x){if($("jerr"))$("jerr").textContent="入唔到房，請再試，或者問老師。"}
  iRender();
}
async function iLeave(){
  try{if(I.room&&I.room.leave)await I.room.leave()}catch(e){}
  I.room=null;I.code=null;I.typed="";I.q=-1;I.ans=null;
  try{sessionStorage.removeItem("icode")}catch(e){}
  $("iConn").textContent="未入房";$("iConn").className="conn";iRender();
}
async function startIpad(){
  iRender();
  if(I.started)return;I.started=true;
  const lobby=await getRoom();I.lobby=lobby;I.lobbyKnown=true;
  $("iConn").textContent=lobby?"未入房":"單機模式";
  let code=null;try{code=sessionStorage.getItem("icode")}catch(e){}
  if(lobby&&code&&/^\d{4}$/.test(code))await iJoin(code);else iRender();
}

if(window.speechSynthesis){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
/* ---------- physical switch (拍掣) ---------- */
const SW={mode:"off"};let lastTick=0;
try{const v=JSON.parse(localStorage.getItem("switch")||"null");if(v&&v.mode&&v.mode!=="off")SW.mode="on"}catch(e){}
function swSave(){try{localStorage.setItem("switch",JSON.stringify({mode:SW.mode}))}catch(e){}}
function swLabel(){$("swOpen").textContent=SW.mode==="on"?"拍掣：開":"拍掣：關";$("swOpen").className="swbtn"+(SW.mode==="on"?" on":"")}
function swPanel(){
  const el=$("swPanel");el.hidden=false;
  el.innerHTML=`<div class="swcard" role="dialog" aria-label="拍掣設定">
    <h2>拍掣設定</h2>
    <p>將拍掣（USB 或者藍牙按鈕，鍵盤模式）連接到呢部 iPad，揀「開」，再撳一下畫面。</p>
    <div class="swrow" id="swMode"></div>
    <p>開咗之後：</p>
    <p>・題目頁：拍一下就自動答啱，同時讀出答案（例如「肚痛」）。老師未轉頁之前再拍，只會再讀一次答案。</p>
    <p>・練習講頁：拍一下就讀出句子；再拍會再讀。</p>
    <p>・自己練習時：答完再拍一下，就去下一題。</p>
    <div class="swrow"><button class="btn main" id="swDone" type="button">完成</button></div></div>`;
  [["off","關"],["on","開"]].forEach(([m,t])=>{const b=document.createElement("button");b.type="button";b.className="opt"+(SW.mode===m?" sel":"");b.textContent=t;b.onclick=()=>{SW.mode=m;swSave();swLabel();swPanel()};$("swMode").appendChild(b)});
  $("swDone").onclick=()=>{el.hidden=true;el.innerHTML="";iRender()};
}
$("swOpen").onclick=()=>swPanel();
swLabel();
function applyScan(){}
const NOKEYS=["Shift","Control","Alt","Meta","Tab","CapsLock","Escape"];
document.addEventListener("keydown",e=>{
  if($("ipad").hidden||SW.mode!=="on"||!$("swPanel").hidden||e.repeat)return;
  if(NOKEYS.includes(e.key))return;
  const t=document.activeElement;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  const q=I.solo?QS[I.soloQ]:(I.q>=0?QS[I.q]:null);
  const nxt=$("sNext");
  const v=$("vTap"),o=$("aO"),x=$("aX");
  if(!q||(!v&&!(o&&x)))return;
  e.preventDefault();
  if(v){if(!I.ans){I.sw=true;v.click()}else if(I.solo&&nxt)nxt.click();else say(q.say);return}
  if(I.canPick){I.sw=true;(q.ok?o:x).click();setTimeout(()=>say(q.say),400);return}
  if(I.solo&&nxt)nxt.click();else say(q.say);
},true);
/* whiteboard: a USB button (keyboard mode) moves the game on */
const BKEYS=["Space","Enter","NumpadEnter","ArrowRight","PageDown"," "];
document.addEventListener("keydown",e=>{
  if($("board").hidden||e.repeat)return;
  const k=e.code&&e.code!=="Unidentified"?e.code:e.key;
  if(!BKEYS.includes(k))return;
  const t=document.activeElement;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  e.preventDefault();
  const q=QS[B.q];
  if(B.phase==="lobby")$("bStart").click();
  else if(B.phase==="ask"&&!q.type)$("bReveal").click();
  else if(B.phase==="ask"||B.phase==="reveal")$("bNext").click();
},true);

route();
})();
